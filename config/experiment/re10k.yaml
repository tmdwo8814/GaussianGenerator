# @package _global_

defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: noposplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips]

wandb:
  name: baseline_analysis
  tags: [re10k, 256x256]

model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: './pretrained_weights/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth'
  decoder:
    make_scale_invariant: true

dataset:
  re10k:
    view_sampler:
      warm_up_steps: 75000

optimizer:
  lr: 1e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 16

trainer:
  # max_steps: 18751
  # max_steps: 80001
  max_steps: 1000
  # val_check_interval: 1500
  val_check_interval: null

  eval_every_n_steps: 200

  auto_eval: true
  auto_eval_index_path: assets/evaluation_index_re10k.json
  auto_eval_save_image: false  # 이미지 저장 여부
  auto_eval_save_video: false  # 비디오 저장 여부
  auto_eval_save_compare: false  # 비교 이미지 저장 여부

checkpointing:
  # every_n_train_steps: 9375
  every_n_train_steps: 200
  save_top_k: -1