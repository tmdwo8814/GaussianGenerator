# @package _global_

defaults:
  - re10k_moment
  - _self_

wandb:
  name: gaussian_decoder_aux
  tags: [re10k, 256x256, moment_decoder, observed_color_aux, romav2]

train:
  auxiliary:
    enabled: true
    weight: 0.05
    warm_up_steps: 100  # Main schedule is inherited; auxiliary weight reaches 0.05 at step 300.
    ramp_steps: 200
    every_n_steps: 1
    max_pairs_per_batch: 1  # Per DDP rank; rotates through batch elements.
    near_scale: 0.01
    far_scale: 100.0
    roma:
      setting: fast  # 512px, no high-resolution refinement; configurable.
      num_matches: 2048
      min_confidence: 0.5
    pose:
      min_inliers: 32
      min_inlier_ratio: 0.25
      ransac_threshold_px: 1.0
      max_reprojection_px: 2.0
      min_parallax_deg: 0.5
      max_alignment_error: 0.5
      ransac_iterations: 10000
