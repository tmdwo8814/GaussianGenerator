# @package _global_

defaults:
  - re10k
  - _self_

wandb:
  name: moment-local-cnn
  tags: [re10k, 256x256, moment_decoder, separate_weight, local_cnn]

model:
  encoder:
    gs_params_head_type: moment
    moment_decoder:
      feature_dim: 256
      hidden_dim: 64
      separate_appearance: true  # Zero-init per-edge scores; geometry is unchanged.
      local_cnn: true  # Source DPT map -> local SH -> appearance-weighted pooling.
      local_cnn_hidden_dim: 256  # 3x3 Conv 256->256, ReLU, zero-init 1x1 Conv -> SH75.
      log_every_n_steps: 50  # Detached incoming-weight/covariance and local SH diagnostics.
      num_neighbors: 16  # Includes self; candidates span both views.
      chunk_size: 32768
      checkpoint_chunks: true
      knn_backend: auto  # Exact CuPy GPU KD-tree on CUDA; SciPy on CPU.
      knn_query_backend: specialized  # Exact FP64 3D/K=16 query; cupy restores the previous query.
      knn_workers: 1  # Used only by the explicit SciPy backend.
      budget_max: 2.0
      budget_init: 0.6931471805599453
      scale_min: 1.0
      scale_max: 3.0
      scale_init: 1.75
      covariance_floor: 0.0001  # Standard deviation relative to scene scale.
      mass_epsilon: 0.000001
      scene_epsilon: 0.000001
