# @package _global_

defaults:
  - re10k
  - _self_

wandb:
  name: moment-shape
  tags: [re10k, 256x256, moment_decoder, appearance_2d, separate_weight, moment_shape]

model:
  encoder:
    gs_params_head_type: moment
    moment_decoder:
      feature_dim: 256
      hidden_dim: 64
      separate_appearance: true
      moment_shape: true
      shape_hidden_dim: 128  # [DPT256 + six normalized moment entries] -> 128 -> 6.
      shape_scale_limit: 4.0  # Positive diagonal range: [1/4, 4], initialized at 1.
      shape_shear_limit: 0.5  # Bounded lower off-diagonals, initialized at 0.
      appearance_2d: true
      appearance_dim: 32  # Compact extra context; keep the original DPT256 path.
      appearance_2d_radii: [1, 4]  # Eight image neighbors per radius, same source view.
      log_every_n_steps: 50  # Detached shape, selection and image-edge metrics.
      num_neighbors: 16  # Includes self; candidates span both views.
      chunk_size: 32768
      checkpoint_chunks: true
      knn_backend: auto  # Exact CuPy GPU KD-tree on CUDA; SciPy on CPU.
      knn_query_backend: specialized  # Exact FP64 3D/K=16 query; cupy restores the previous query.
      knn_workers: 1  # Used only by the explicit SciPy backend.
      budget_max: 2.0
      budget_init: 0.6931471805599453
      scale_min: 1.0
      scale_max: 3.0
      scale_init: 1.75
      covariance_floor: 0.0001  # Standard deviation relative to scene scale.
      mass_epsilon: 0.000001
      scene_epsilon: 0.000001
