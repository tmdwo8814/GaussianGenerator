# @package _global_

defaults:
  - re10k
  - _self_

wandb:
  name: gaussian_decoder_dpt256_sim3
  tags: [re10k, 256x256, moment_decoder, sim3_alignment]

model:
  encoder:
    gs_params_head_type: moment
    moment_decoder:
      feature_dim: 256
      hidden_dim: 64
      num_neighbors: 16  # Includes self; candidates span both views.
      chunk_size: 32768
      checkpoint_chunks: true
      knn_backend: auto  # Exact CuPy GPU KD-tree on CUDA; SciPy on CPU.
      knn_query_backend: specialized  # Exact FP64 3D/K=16 query; cupy restores the previous query.
      knn_workers: 1  # Used only by the explicit SciPy backend.
      budget_max: 2.0
      budget_init: 0.6931471805599453
      scale_min: 1.0
      scale_max: 3.0
      scale_init: 1.75
      covariance_floor: 0.0001  # Standard deviation relative to scene scale.
      mass_epsilon: 0.000001
      scene_epsilon: 0.000001
    support_alignment:
      enabled: true
      descriptor_dim: 32  # Matching only; moment decoding keeps all 256 DPT channels.
      hidden_dim: 64
      source_grid: 16
      target_grid: 32
      extra_cells: 64  # Four fixed quarter-cell positions each; total queries = 512.
      fine_window: 16
      temperature: 0.1

train:
  descriptor_teacher:
    enabled: true
    setting: fast
    every_n_steps: 1  # One rotating scene per GPU, not the full local batch.
    warmup_steps: 1000  # Main photometric training continues; apply Sim(3) after this.
    match_weight: 0.05
    alignment_weight: 0.05
    min_confidence: 0.5
    correctness_pixels: 2.0
    log_every_n_steps: 50
