# @package _global_

defaults:
  - re10k
  - _self_

wandb:
  name: final_plus_budget4
  tags: [re10k, 256x256, moment_decoder, dpt256, appearance_2d, separate_weight, appearance_capacity, appearance_moments, final_plus]

# Final++: Final + wider/deeper SH MLP (A) + appearance feature std (B).
# Training length is inherited from re10k.yaml (trainer.max_steps); set it manually.
model:
  encoder:
    gs_params_head_type: moment
    moment_decoder:
      feature_dim: 256
      hidden_dim: 64
      appearance_2d: true
      separate_appearance: true  # Independent weights on the original 3D graph.
      appearance_capacity: true
      appearance_heads: 2
      appearance_dim: 32  # Per head: 2 x 32 = 64 context channels.
      appearance_mlp_dim: 256
      appearance_mlp_depth: 2  # [mean256, std256, context64] -> 256 -> 256 -> SH75.
      appearance_moments: true  # Weighted std on the same wA graph; no new parameters.
      appearance_variance_epsilon: 0.000001  # Stabilizes sqrt near zero feature variance.
      checkpoint_appearance: true  # Keep scene outputs; recompute appearance activations in backward.
      appearance_2d_radii: [1, 4]  # Eight image neighbors per radius, same source view.
      log_every_n_steps: 50  # Detached candidate/selection and image-edge metrics.
      num_neighbors: 16  # Includes self; candidates span both views.
      chunk_size: 32768
      checkpoint_chunks: true
      compile_kernels: true  # Regional fusion; initial CUDA steps include compilation.
      cache_image_neighbors: true  # Fixed 2D layout only; never reuse 3D kNN or features.
      batch_appearance_projections: true  # Same independent heads; batch support-level projections.
      knn_backend: auto  # Exact CuPy GPU KD-tree on CUDA; SciPy on CPU.
      knn_query_backend: specialized  # Exact FP64 3D/K=16 query; cupy restores the previous query.
      knn_workers: 1  # Used only by the explicit SciPy backend.
      budget_max: 4.0
      budget_init: 0.6931471805599453
      scale_min: 1.0
      scale_max: 3.0
      scale_init: 1.75
      covariance_floor: 0.0001  # Standard deviation relative to scene scale.
      mass_epsilon: 0.000001
      scene_epsilon: 0.000001
