# @package _global_

defaults:
  - re10k
  - _self_

wandb:
  name: appearance_capacity
  tags: [re10k, 256x256, moment_decoder, appearance_capacity, v1]

model:
  encoder:
    gs_params_head_type: moment
    moment_decoder:
      feature_dim: 256
      hidden_dim: 64
      appearance_2d: true
      separate_appearance: true  # Independent weights on the original 3D graph.
      appearance_capacity: true
      appearance_heads: 4
      appearance_dim: 32  # Per head: 4 x 32 = 128 context channels.
      appearance_mlp_dim: 256  # [selected DPT256, context128] -> 256 -> SH75.
      appearance_2d_radii: [1, 4]  # Eight image neighbors per radius, same source view.
      log_every_n_steps: 50  # Detached candidate/selection and image-edge metrics.
      num_neighbors: 16  # Includes self; candidates span both views.
      chunk_size: 32768
      checkpoint_chunks: true
      knn_backend: auto  # Exact CuPy GPU KD-tree on CUDA; SciPy on CPU.
      knn_query_backend: specialized  # Exact FP64 3D/K=16 query; cupy restores the previous query.
      knn_workers: 1  # Used only by the explicit SciPy backend.
      budget_max: 2.0
      budget_init: 0.6931471805599453
      scale_min: 1.0
      scale_max: 3.0
      scale_init: 1.75
      covariance_floor: 0.0001  # Standard deviation relative to scene scale.
      mass_epsilon: 0.000001
      scene_epsilon: 0.000001
